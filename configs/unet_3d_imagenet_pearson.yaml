base: base.yaml
experiment_name: unet_3d_imagenet_pearson

data:
  # Per-volume adaptive Z-band (stats z_auto from compute_stats.py) instead of
  # base.yaml's fixed [70, 105] — the 051826 stacks vary from Z=70 to Z=183, so
  # fixed indices drop shallow stacks and pad others.
  z_range: auto
  # base.yaml sets cache_volumes: true -> every worker holds its own full-volume
  # RAM cache -> host OOM (SIGKILL). With cache off the dataset mmaps and (since
  # the crop-first fast path) reads/normalizes only each patch's pages. If the
  # data lives on EFS/NFS, run scripts/localize_data.sh first so those random
  # page reads hit local disk instead of the network.
  cache_volumes: false

training:
  # cache_volumes is off (mmap), so workers hold almost no RAM -> 4 is safe and
  # keeps the 3D GPU fed (num_workers is read from the training section, not data).
  num_workers: 4
  losses:
    pearson: 1.0
  checkpoint_dir: ckpts/unet_3d_imagenet_pearson
